name: PR Labeler
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, edited, closed, synchronize]

jobs:
  label:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: srvaroa/labeler@bf262763a8a8e191f5847873aecc0f29df84f957 # v1.14.0
      env:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
